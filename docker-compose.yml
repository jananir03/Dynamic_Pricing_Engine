services:
  mysql:
    image: mysql:8.0
    container_name: dynamic-pricing-mysql
    restart: unless-stopped

    env_file:
      - .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3309:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  redis:
    image: redis:7-alpine
    container_name: dynamic-pricing-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: dynamic-pricing-backend

    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8002:8000"

    volumes:
      - ./backend:/app

    depends_on:
      mysql:
        condition: service_healthy

      redis:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: dynamic-pricing-frontend

    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend


volumes:
  mysql_data:
  redis_data: